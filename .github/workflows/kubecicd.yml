name: KubeCI/CD

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

# Docker Desktop ne doit executer qu'un rollout a la fois.
concurrency:
  group: bankaccount-docker-desktop
  cancel-in-progress: true

env:
  DOTNET_VERSION: 8.0.x
  PROJECT_FILE: BankAccountServices.csproj
  IMAGE_REPOSITORY: bankaccount-kube
  DEPLOYMENT: bankaccount-kube-deployment
  CONTAINER: bankaccount
  MANIFEST: bankaccount-deployment.yaml

jobs:
  build-and-deploy:
    name: Build and deploy to Docker Desktop Kubernetes
    # Ce runner doit etre installe sur le PC qui heberge Docker Desktop.
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        env:
          # Le runner Windows s'exécute comme service et ne peut pas écrire
          # dans C:\Program Files\dotnet.
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}\dotnet
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        shell: powershell
        # Le runner Docker Desktop a une mémoire limitée : éviter les restaurations
        # NuGet simultanées qui augmentent le pic mémoire avant la compilation.
        run: dotnet restore $env:PROJECT_FILE --disable-parallel

      - name: Build
        shell: powershell
        # Une compilation séquentielle évite les OOM de Razor/CreateAppHost sur le
        # runner Windows. L'apphost Windows est inutile : l'application est lancée
        # dans le conteneur avec `dotnet BankAccountServices.dll`.
        run: dotnet build $env:PROJECT_FILE --configuration Release --no-restore --disable-build-servers --maxcpucount:1 -p:UseAppHost=false
      - name: Check Docker Desktop and Kubernetes
        shell: powershell
        run: |
          docker version
          $context = kubectl config current-context
          if ($context -ne 'docker-desktop') {
            throw "Le contexte Kubernetes doit etre 'docker-desktop', actuel : $context"
          }
          kubectl get secret bankaccount-db
          kubectl get secret bankaccount-jwt

      - name: Build image
        shell: powershell
        run: |
          $image = "$env:IMAGE_REPOSITORY`:$env:GITHUB_SHA"
          docker build --tag $image .

      - name: Deploy image
        shell: powershell
        run: |
          $image = "$env:IMAGE_REPOSITORY`:$env:GITHUB_SHA"
          $manifest = Get-Content -Raw $env:MANIFEST
          # Le manifeste est extrait sous Windows (CRLF) : conserver le retour
          # chariot final tout en remplaçant uniquement la valeur de `image`.
          $updatedManifest = $manifest -replace '(?m)^([ \t]*image:[ \t]*)\S+[ \t]*\r?$', "`${1}$image"

          if ($updatedManifest -eq $manifest) {
            throw "Aucune image n'a ete trouvee dans $env:MANIFEST."
          }

          Set-Content -Path $env:MANIFEST -Value $updatedManifest -NoNewline
          kubectl apply -f $env:MANIFEST
          kubectl rollout status "deployment/$env:DEPLOYMENT" --timeout=180s

      - name: Show deployed resources
        shell: powershell
        run: |
          kubectl get pods -l app=bankaccount
          kubectl get service bankaccount-service
