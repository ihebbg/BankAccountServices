name: CI/CD - Docker Desktop Kubernetes

on:
  push:
    branches: [master]
  workflow_dispatch:

# Le runner doit être installé sur le poste qui héberge Docker Desktop et son
# cluster Kubernetes. Un runner GitHub hébergé ne peut pas accéder à ce cluster.
permissions:
  contents: read

concurrency:
  group: bankaccount-docker-desktop
  cancel-in-progress: true

jobs:
  build-and-deploy:
    # Ajoutez le label personnalisé "docker-desktop" au runner self-hosted.
    runs-on: [self-hosted, windows, docker-desktop]

    env:
      PROJECT_FILE: BankAccountServices.csproj
      IMAGE_NAME: bankaccount-kube
      DEPLOYMENT_NAME: bankaccount-kube-deployment
      CONTAINER_NAME: bankaccount
      KUBERNETES_CONTEXT: docker-desktop

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore and build
        shell: pwsh
        run: |
          dotnet restore $env:PROJECT_FILE
          dotnet build $env:PROJECT_FILE --configuration Release --no-restore

      - name: Verify Docker Desktop and Kubernetes access
        shell: pwsh
        run: |
          docker version
          kubectl config use-context $env:KUBERNETES_CONTEXT
          kubectl cluster-info
          kubectl get nodes

      - name: Validate required Kubernetes secret
        shell: pwsh
        run: |
          kubectl get secret bankaccount-db

      - name: Build image in Docker Desktop
        id: image
        shell: pwsh
        run: |
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          $image = "$env:IMAGE_NAME`:$shortSha"
          docker build --pull --tag $image --tag "$env:IMAGE_NAME`:latest" .
          "image=$image" >> $env:GITHUB_OUTPUT

      - name: Deploy to Kubernetes
        shell: pwsh
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          # L'image vient du même moteur Docker que Kubernetes Docker Desktop;
          # aucun registre distant ni artifact GitHub n'est nécessaire.
          kubectl apply -f bankaccount-deployment.yaml
          kubectl set image "deployment/$env:DEPLOYMENT_NAME" "$env:CONTAINER_NAME=$env:IMAGE"
          kubectl rollout status "deployment/$env:DEPLOYMENT_NAME" --timeout=5m

      - name: Show deployed version
        shell: pwsh
        run: |
          kubectl get deployment $env:DEPLOYMENT_NAME
          kubectl get pods -l app=bankaccount
          kubectl get service bankaccount-service
          kubectl get deployment $env:DEPLOYMENT_NAME -o jsonpath='{.spec.template.spec.containers[0].image}'
