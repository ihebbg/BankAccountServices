name: CI/CD Pipeline

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout le code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup .NET
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 3. Restaurer les packages NuGet
      - name: Restore NuGet Packages
        run: dotnet restore

      # 4. Compiler le projet
      - name: Build Project
        run: dotnet build -c Release --no-restore

      # 5. Construire l'image Docker avec version dynamique
      - name: Build Docker Image
        run: |
          # Utiliser le SHA du commit (court) comme version
          IMAGE_TAG=${{ github.sha }}
          SHORT_SHA=${IMAGE_TAG:0:7}
          
          echo "Building image with tags: bankaccount-kube:$SHORT_SHA and bankaccount-kube:latest"
          docker build -t bankaccount-kube:$SHORT_SHA -t bankaccount-kube:latest -t bankaccount-kube:v1 .
          
          # Sauvegarder le tag pour les étapes suivantes
          echo "IMAGE_TAG=$SHORT_SHA" >> $GITHUB_ENV

      # 6. Sauvegarder l'image Docker en tar
      - name: Save Docker Image
        run: |
          # Sauvegarder avec le tag dynamique
          docker save bankaccount-kube:${{ env.IMAGE_TAG }} -o bankaccount-image.tar
          echo "Image sauvegardée avec le tag: ${{ env.IMAGE_TAG }}"

      # 7. Uploader l'image en tant qu'artifact
      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: bankaccount-image.tar
          retention-days: 1

      # 8. Charger l'image Docker en tar (optionnel pour local testing)
      - name: Load Docker Image for Local Testing
        run: |
          docker load -i bankaccount-image.tar
          echo "✓ Image Docker chargée avec succès"
          docker images | grep bankaccount-kube || true
        continue-on-error: true

      # 9. Injecter la version dynamique dans le YAML
      - name: Update Deployment Image
        run: |
          # Créer une copie du fichier de déploiement
          cp bankaccount-deployment.yaml bankaccount-deployment-updated.yaml
          
          # Remplacer le tag de l'image avec la version dynamique
          sed -i "s|image: bankaccount-kube:.*|image: bankaccount-kube:${{ env.IMAGE_TAG }}|g" bankaccount-deployment-updated.yaml
          
          echo "=== Deployment YAML mis à jour ==="
          cat bankaccount-deployment-updated.yaml

      # 10. Configurer la connexion Kubernetes
      - name: Configure Kubernetes Access
        run: |
          # Vérifier si kubectl est disponible
          if ! command -v kubectl &> /dev/null; then
            echo "⚠️  kubectl n'est pas disponible"
            exit 0
          fi
          
          # Afficher le contexte actuel
          echo "=== Contexte Kubernetes actuel ==="
          kubectl config current-context || echo "Aucun contexte configuré"
          
          # Lister les contextes disponibles
          echo ""
          echo "=== Contextes disponibles ==="
          kubectl config get-contexts || echo "Aucun contexte"
        continue-on-error: true

      # 11. Déployer sur Kubernetes (si disponible)
      - name: Deploy to Kubernetes
        run: |
          echo "=== Tentative de déploiement sur Kubernetes ==="
          
          # Vérifier la connexion au cluster
          if kubectl cluster-info &> /dev/null; then
            echo "✓ Cluster Kubernetes détecté"
            
            # Appliquer le deployment
            kubectl apply -f bankaccount-deployment-updated.yaml
            echo "✓ Deployment appliqué"
            
            # Attendre que les pods soient prêts
            echo ""
            echo "=== Attente du déploiement ==="
            kubectl rollout status deployment/bankaccount-kube-deployment --timeout=5m || true
            
          else
            echo "⚠️  Aucun cluster Kubernetes disponible"
            echo "ℹ️  Téléchargez l'artifact 'docker-image' depuis GitHub Actions"
            echo "ℹ️  Et chargez-le localement: docker load -i docker-image/bankaccount-image.tar"
            exit 0
          fi
        continue-on-error: true

      # 12. Vérifier le statut du déploiement
      - name: Check Deployment Status
        run: |
          if kubectl cluster-info &> /dev/null; then
            echo "=== Statut du Déploiement ==="
            kubectl get deployments -l app=bankaccount
            
            echo ""
            echo "=== Pods ==="
            kubectl get pods -l app=bankaccount
            
            echo ""
            echo "=== Services ==="
            kubectl get services
          else
            echo "ℹ️  Cluster Kubernetes non disponible"
          fi
        continue-on-error: true

      # 13. Afficher les détails du déploiement
      - name: Show Deployment Info
        run: |
          if kubectl cluster-info &> /dev/null; then
            echo "=== Détails du Deployment ==="
            kubectl describe deployment bankaccount-kube-deployment || true
            
            echo ""
            echo "=== Logs des Pods ==="
            kubectl logs -l app=bankaccount --tail=20 || true
          else
            echo "ℹ️  Pour utiliser l'image localement:"
            echo "1. Téléchargez l'artifact 'docker-image' depuis GitHub Actions"
            echo "2. Extrayez: docker load -i docker-image/bankaccount-image.tar"
            echo "3. Déployez: kubectl apply -f bankaccount-deployment.yaml"
          fi
        continue-on-error: true
