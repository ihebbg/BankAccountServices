apiVersion: v1
kind: ConfigMap
metadata:
  name: monitoring-grafana-pods-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  k8s-pods-overview.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "gnetId": null,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "PROMETHEUS"},
          "fieldConfig": {"defaults": {}, "overrides": []},
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 0},
          "id": 1,
          "options": {"legend": {"displayMode": "list"}},
          "pluginVersion": "8.0.0",
          "targets": [
            {"expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{container!~\"POD|\\"\"\"}[5m]))", "refId": "A"}
          ],
          "title": "CPU Usage (per Pod)",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "PROMETHEUS"},
          "fieldConfig": {"defaults": {}, "overrides": []},
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 8},
          "id": 2,
          "options": {"legend": {"displayMode": "list"}},
          "pluginVersion": "8.0.0",
          "targets": [
            {"expr": "sum by (pod) (container_memory_usage_bytes{container!~\"POD|\\"\"\"})", "refId": "A"}
          ],
          "title": "Memory Usage (per Pod)",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "PROMETHEUS"},
          "fieldConfig": {"defaults": {}, "overrides": []},
          "gridPos": {"h": 6, "w": 12, "x": 0, "y": 16},
          "id": 3,
          "options": {"orientation": "auto"},
          "pluginVersion": "8.0.0",
          "targets": [
            {"expr": "sum by (pod) (increase(kube_pod_container_status_restarts_total[1h]))", "refId": "A"}
          ],
          "title": "Restarts (last 1h)",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "PROMETHEUS"},
          "fieldConfig": {"defaults": {}, "overrides": []},
          "gridPos": {"h": 6, "w": 12, "x": 12, "y": 16},
          "id": 4,
          "options": {},
          "pluginVersion": "8.0.0",
          "targets": [
            {"expr": "count by (phase) (kube_pod_status_phase)", "refId": "A"}
          ],
          "title": "Pod Statuses",
          "type": "barchart"
        }
      ],
      "refresh": "10s",
      "schemaVersion": 30,
      "style": "dark",
      "tags": ["kubernetes","pods"],
      "templating": {"list": []},
      "time": {"from": "now-1h", "to": "now"},
      "timepicker": {},
      "title": "Kubernetes Pods Overview",
      "uid": "k8s-pods-overview",
      "version": 1
    }
